<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/moose-face.png" />
    <link rel="apple-touch-icon" href="/moose-face.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#131019" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="맘무스" />
    <title>맘무스 · 커플 여행 플래너</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- 한글 폰트: NanumSquare 로 통일 -->
    <link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- 저장된 커스텀 테마를 React 로드 전에 미리 적용 (첫 프레임 색 깜빡임 방지).
         계산식은 src/App.tsx applyTheme 과 동일하게 유지할 것. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('mammoose-store') || '{}').state || {};
          var t = s.settings || {};
          if (!t.themeAccent && !t.themeBg) return;
          var hex = function (h) {
            h = (h || '').replace('#', '');
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            var n = parseInt(h, 16); return [(n>>16)&255,(n>>8)&255,n&255];
          };
          var tri = function (a){ return Math.round(a[0])+' '+Math.round(a[1])+' '+Math.round(a[2]); };
          var mix = function (a,b,p){ return [a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p]; };
          var acc = hex(t.themeAccent || '#ee86a9'), base = hex(t.themeBg || '#131019');
          var lum = (0.299*base[0]+0.587*base[1]+0.114*base[2])/255;
          var light = lum > 0.55, fg = light ? [26,24,32] : [237,237,241], S = document.documentElement.style;
          S.setProperty('--c-accent', tri(acc));
          S.setProperty('--c-bg', tri(base));
          S.setProperty('--c-surface', tri(mix(base, fg, light?0.05:0.07)));
          S.setProperty('--c-surface-2', tri(mix(base, fg, light?0.1:0.13)));
          S.setProperty('--c-edge', tri(mix(base, fg, 0.17)));
          S.setProperty('--c-fg', tri(fg));
          S.setProperty('--c-fg-dim', tri(mix(fg, base, 0.42)));
          document.documentElement.toggleAttribute('data-lighttheme', light);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
